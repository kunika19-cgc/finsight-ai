<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1a1f2b">FinSight AI — System Architecture</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">Razorpay AI Buildathon · Track 02: AI Risk Manager</text>

  <!-- Offline / training pipeline -->
  <rect x="30" y="90" width="1120" height="150" rx="10" fill="#f4f6fb" stroke="#dfe4ee"/>
  <text x="50" y="112" font-size="13" font-weight="700" fill="#374151">OFFLINE — Training Pipeline (python train_model.py)</text>

  <!-- Dataset -->
  <rect x="50" y="130" width="180" height="80" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="140" y="160" font-size="13" font-weight="600" text-anchor="middle" fill="#3730a3">Kaggle dataset</text>
  <text x="140" y="178" font-size="11" text-anchor="middle" fill="#4b5563">transactions_sample.csv</text>
  <text x="140" y="194" font-size="11" text-anchor="middle" fill="#4b5563">(47.5k txns, 15.8% fraud)</text>

  <line x1="230" y1="170" x2="288" y2="170" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- train_model.py -->
  <rect x="290" y="130" width="200" height="80" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="390" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="#065f46">train_model.py</text>
  <text x="390" y="173" font-size="11" text-anchor="middle" fill="#4b5563">RandomForestClassifier</text>
  <text x="390" y="189" font-size="11" text-anchor="middle" fill="#4b5563">stratified 80/20 split</text>
  <text x="390" y="205" font-size="11" text-anchor="middle" fill="#4b5563">+ slice checks</text>

  <line x1="490" y1="170" x2="548" y2="170" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Artifacts -->
  <rect x="550" y="130" width="230" height="80" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="665" y="150" font-size="13" font-weight="600" text-anchor="middle" fill="#9a3412">Artifacts written to /models</text>
  <text x="665" y="168" font-size="11" text-anchor="middle" fill="#4b5563">fraud_model.pkl · le_category.pkl · le_gender.pkl</text>
  <text x="665" y="184" font-size="11" text-anchor="middle" fill="#4b5563">metrics.json (precision/recall, cost</text>
  <text x="665" y="199" font-size="11" text-anchor="middle" fill="#4b5563">estimates, slice checks) · test_predictions.csv</text>

  <line x1="665" y1="211" x2="665" y2="248" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Online / serving pipeline -->
  <rect x="30" y="255" width="1120" height="330" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="50" y="277" font-size="13" font-weight="700" fill="#374151">ONLINE — Streamlit App (app.py)</text>

  <!-- App loader -->
  <rect x="50" y="295" width="230" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="165" y="320" font-size="13" font-weight="600" text-anchor="middle" fill="#3730a3">load_data / load_metrics /</text>
  <text x="165" y="337" font-size="12" text-anchor="middle" fill="#3730a3">load_test_predictions</text>

  <line x1="280" y1="325" x2="330" y2="325" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tabs -->
  <rect x="332" y="285" width="818" height="290" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="352" y="308" font-size="12" font-weight="700" fill="#374151">5 dashboard tabs</text>

  <!-- Overview tab -->
  <rect x="352" y="318" width="150" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="427" y="339" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Overview</text>
  <text x="427" y="354" font-size="10.5" text-anchor="middle" fill="#6b7280">key fraud metrics</text>

  <!-- Performance tab -->
  <rect x="352" y="380" width="150" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="427" y="401" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Performance</text>
  <text x="427" y="415" font-size="10.5" text-anchor="middle" fill="#6b7280">precision/recall,</text>
  <text x="427" y="428" font-size="10.5" text-anchor="middle" fill="#6b7280">ROC/PR, slice checks</text>

  <!-- Insights tab -->
  <rect x="352" y="442" width="150" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="427" y="463" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Insights</text>
  <text x="427" y="478" font-size="10.5" text-anchor="middle" fill="#6b7280">fraud by category/</text>
  <text x="427" y="491" font-size="10.5" text-anchor="middle" fill="#6b7280">amount/hour</text>

  <!-- Live tab -->
  <rect x="518" y="318" width="290" height="176" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="663" y="339" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">Live Prediction</text>
  <text x="663" y="356" font-size="10.5" text-anchor="middle" fill="#065f46">1. RandomForest → fraud probability</text>
  <text x="663" y="372" font-size="10.5" text-anchor="middle" fill="#065f46">2. SHAP TreeExplainer → per-txn</text>
  <text x="663" y="386" font-size="10.5" text-anchor="middle" fill="#065f46">   feature attribution</text>
  <text x="663" y="404" font-size="10.5" text-anchor="middle" fill="#065f46">3. "Explain in plain English"</text>
  <text x="663" y="418" font-size="10.5" text-anchor="middle" fill="#065f46">   → Groq LLM narrates the</text>
  <text x="663" y="432" font-size="10.5" text-anchor="middle" fill="#065f46">   SHAP values (no influence</text>
  <text x="663" y="446" font-size="10.5" text-anchor="middle" fill="#065f46">   on the model's own output)</text>
  <text x="663" y="466" font-size="10" font-style="italic" text-anchor="middle" fill="#047857">→ logged to logs/audit_trail.csv</text>

  <!-- Batch tab -->
  <rect x="828" y="318" width="290" height="176" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="973" y="339" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Batch Scoring</text>
  <text x="973" y="358" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Upload CSV of transactions</text>
  <text x="973" y="374" font-size="10.5" text-anchor="middle" fill="#1e3a8a">→ score every row against the</text>
  <text x="973" y="388" font-size="10.5" text-anchor="middle" fill="#1e3a8a">   same trained model</text>
  <text x="973" y="406" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Unknown category/gender rows</text>
  <text x="973" y="420" font-size="10.5" text-anchor="middle" fill="#1e3a8a">are flagged and skipped, not</text>
  <text x="973" y="434" font-size="10.5" text-anchor="middle" fill="#1e3a8a">silently mishandled</text>
  <text x="973" y="452" font-size="10.5" text-anchor="middle" fill="#1e3a8a">Risk-distribution chart +</text>
  <text x="973" y="466" font-size="10.5" text-anchor="middle" fill="#1e3a8a">downloadable results CSV</text>

  <!-- Arrows Overview/Performance/Insights read metrics -->
  <line x1="502" y1="344" x2="518" y2="380" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="551" font-size="10.5" fill="#6b7280">Overview / Performance / Insights read directly from metrics.json — no hardcoded numbers in the app</text>

  <!-- Audit trail box -->
  <rect x="352" y="524" width="798" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="751" y="550" font-size="11.5" font-weight="600" text-anchor="middle" fill="#92400e">logs/audit_trail.csv — every live + batch prediction logged with timestamp, inputs, probability, decision (defense-only: scores &amp; flags, never auto-blocks)</text>

  <line x1="663" y1="494" x2="751" y2="524" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="973" y1="494" x2="751" y2="524" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="30" y="605" font-size="11" fill="#9ca3af">Deployed on Render · streamlit run app.py</text>
</svg>
